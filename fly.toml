# fly.toml app configuration file generated for dolos-ai on 2026-11-21T15:30:20-05:00
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'dolos-ai'
primary_region = 'iad'

[build]
[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpus = 1

[env]
  DOLOS_MODEL_DIR = "/app/dolos/demo_assets/artifacts"
