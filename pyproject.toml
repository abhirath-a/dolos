[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dolos"
version = "0.1.0"
description = "Queued statement ingestion and temporal transaction graph API"
requires-python = ">=3.9"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.18", "pypdf>=5,<7"]

[project.optional-dependencies]
r2 = ["boto3>=1.36,<2"]
turso = ["libsql>=0.1,<1"]
pdf-llm = ["openai>=1.68,<3", "pypdfium2>=4.30,<6", "Pillow>=10,<13"]
ml = ["numpy==2.0.2", "polars==1.32.3", "torch==2.8.0", "torch-geometric==2.6.1", "scikit-learn==1.6.1", "xgboost==2.1.4"]
test = ["pytest>=8,<9", "httpx>=0.27,<1"]

[project.scripts]
dolos-worker = "dolos.worker:main"
dolos-train = "dolos.train:main"
dolos-demo = "dolos.demo:main"
dolos-migrate = "dolos.migrate:main"
dolos-storage = "dolos.storage_setup:main"

[tool.setuptools.packages.find]
include = ["dolos*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
dolos = ["migrations/*.sql", "migrations/*.json"]
